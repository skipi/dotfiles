set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -s escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g detach-on-destroy off
set -g display-time 2000

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,*256col*:Tc"
set -ga terminal-features ",xterm-ghostty:usstyle"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind Enter copy-mode

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind -r m resize-pane -Z

bind s choose-tree -Zs
bind f run-shell "tmux neww ~/dotfiles/bin/tmux-sessionizer"
bind g run-shell "tmux neww -c '#{pane_current_path}' lazygit"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set -g status-position top
set -g status-interval 5
set -g status-style "bg=default fg=#545c7e"
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]"
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#e0af68]● ,}#[fg=#545c7e]%a %d %b  #[fg=#7aa2f7]%H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26 fg=#c0caf5"
set -g mode-style "bg=#283457 fg=#c0caf5"
